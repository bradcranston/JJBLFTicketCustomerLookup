<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import "./src/style.css";
    </style>
    <title>Customer Lookup</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Search by Customer Number, Customer, Site, or Address..." />
          <button id="clearButton">Clear</button>
        </div>
      </div>
      
      <div class="table-container">
        <table id="customerTable">
          <thead>
            <tr>
              <th class="sortable" data-column="CustomerNumber">
                Customer Number
                <span class="sort-arrow">↕</span>
              </th>
              <th class="sortable" data-column="Customer">
                Customer
                <span class="sort-arrow">↕</span>
              </th>
              <th class="sortable" data-column="Name">
                Site
                <span class="sort-arrow">↕</span>
              </th>
              <th class="sortable" data-column="AddrServ_1Line">
                Address
                <span class="sort-arrow">↕</span>
              </th>
            </tr>
          </thead>
          <tbody id="customerTableBody">
            <!-- Data will be loaded here -->
          </tbody>
        </table>
      </div>
      
      <div class="loading" id="loadingIndicator">
        Initializing application...
      </div>
    </div>

    <script type="module">
      import "./src/index.js";
    </script>
  </body>
</html>
